name: Tests

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run RNIDS test-registry mutations (requires live secrets and fixtures)
        type: boolean
        default: false
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:

permissions:
  contents: read

jobs:
  unit-tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.event_name }}-${{ github.ref }}-php-${{ matrix.php }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, openssl, json, intl
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests (coverage leg)
        if: matrix.php == '8.1'
        run: composer test:coverage:ci

      - name: Run unit tests
        if: matrix.php != '8.1'
        run: composer test:unit

      - name: Upload coverage to Codecov
        if: matrix.php == '8.1'
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          slug: oblakhost/rnids-rsreg-client-php
          token: ${{ secrets.CODECOV_TOKEN }}

  static-analysis:
    name: PHPStan and PHPCS
    runs-on: ubuntu-latest
    concurrency:
      group: static-analysis-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: dom, openssl, json, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPCS
        run: composer phpcs

  distribution:
    name: Distribution smoke check
    runs-on: ubuntu-latest
    concurrency:
      group: distribution-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: dom, openssl, json, intl
          coverage: none

      - name: Build and test both distribution archives offline
        run: composer test:dist

  offline-gate:
    name: Offline quality gate
    if: always()
    needs: [unit-tests, static-analysis, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Require every offline check to pass
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$DISTRIBUTION_RESULT" = success

  release:
    name: Release
    needs: offline-gate
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/master", "refs/heads/develop", "refs/heads/alpha", "refs/heads/beta"]'), github.ref)
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    secrets:
      OBLAKBOT_PAT: ${{ secrets.OBLAKBOT_PAT }}
      OBLAKBOT_GPG_KEY: ${{ secrets.OBLAKBOT_GPG_KEY }}
      OBLAKBOT_GPG_PASS: ${{ secrets.OBLAKBOT_GPG_PASS }}

  integration-live:
    name: Integration (live RNIDS)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    needs: offline-gate
    concurrency:
      group: integration-live-${{ github.repository }}
      cancel-in-progress: false
    env:
      RNIDS_EPP_USERNAME: ${{ secrets.RNIDS_EPP_USER }}
      RNIDS_EPP_PASSWORD: ${{ secrets.RNIDS_EPP_PASS }}
      RNIDS_EPP_CERT: ${{ secrets.RNIDS_EPP_CERT }}
      RNIDS_EPP_ROOT: ${{ secrets.RNIDS_EPP_ROOT }}
      RNIDS_EPP_CLIENT_CERT_PASSWORD: ${{ secrets.RNIDS_EPP_CLIENT_CERT_PASSWORD }}
      RNIDS_EPP_HOST: ${{ vars.RNIDS_EPP_HOST }}
      RNIDS_EPP_TEST_DOMAIN: ${{ vars.RNIDS_EPP_TEST_DOMAIN }}
      RNIDS_EPP_TEST_HOST_IPV4: ${{ vars.RNIDS_EPP_TEST_HOST_IPV4 }}
      RNIDS_EPP_REGISTER_NAMESERVERS: ${{ vars.RNIDS_EPP_REGISTER_NAMESERVERS }}
      RNIDS_EPP_POLL_ACK_MESSAGE_ID: ${{ vars.RNIDS_EPP_POLL_ACK_MESSAGE_ID }}

    steps:
      - name: Check required live credentials
        run: |
          test -n "$RNIDS_EPP_USERNAME" && test -n "$RNIDS_EPP_PASSWORD" && test -n "$RNIDS_EPP_CERT" && test -n "$RNIDS_EPP_ROOT" || {
            echo "Live RNIDS tests requested, but required credentials or certificate secrets are missing."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: dom, openssl, json, intl

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare RNIDS certificates
        run: |
          umask 077
          mkdir -p tests/fixtures
          printf '%s' "$RNIDS_EPP_CERT" > tests/fixtures/client.pem
          printf '%s' "$RNIDS_EPP_ROOT" > tests/fixtures/root.pem

      - name: Run required live integration tests
        env:
          RNIDS_EPP_CLIENT_CERT_PATH: tests/fixtures/client.pem
          RNIDS_EPP_CA_CERT_PATH: tests/fixtures/root.pem
        run: composer test:live

      - name: Remove RNIDS certificates
        if: always()
        run: rm -f tests/fixtures/client.pem tests/fixtures/root.pem
