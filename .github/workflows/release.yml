name: Release

on:
  workflow_call:
    secrets:
      OBLAKBOT_PAT:
        required: true
      OBLAKBOT_GPG_KEY:
        required: true
      OBLAKBOT_GPG_PASS:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release verified commit
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/master", "refs/heads/develop", "refs/heads/alpha", "refs/heads/beta"]'), github.ref)
    runs-on: ubuntu-latest
    concurrency:
      # All release branches share tags and release state. Do not interrupt
      # publication when a newer commit starts its offline checks.
      group: semantic-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.OBLAKBOT_PAT }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: gpg
        with:
          gpg_private_key: ${{ secrets.OBLAKBOT_GPG_KEY }}
          passphrase: ${{ secrets.OBLAKBOT_GPG_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Confirm verified commit is still the release branch head
        id: head
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head=$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "A newer commit is awaiting its own quality gate; skipping this release."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B "$RELEASE_BRANCH" "$GITHUB_SHA"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        if: steps.head.outputs.current == 'true'
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/github
            @semantic-release/exec
        env:
          GIT_AUTHOR_NAME: ${{ steps.gpg.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg.outputs.email }}
          GITHUB_TOKEN: ${{ secrets.OBLAKBOT_PAT }}
